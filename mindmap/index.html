<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>目录组织结构 – MindMap Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── top bar ── */
    header {
      background: #1a237e;
      color: #fff;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* ── main layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── left panel ── */
    .panel {
      width: 280px;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .panel h3 {
      font-size: 14px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: #333;
    }

    .form-group input, .form-group select {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #4285f4;
    }

    .color-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .color-row input[type="color"] {
      width: 38px;
      height: 32px;
      padding: 2px;
      border-radius: 4px;
      cursor: pointer;
    }

    .color-row label { flex: 1; }

    button {
      padding: 9px 0;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }

    .btn-add    { background: #4285f4; color: #fff; }
    .btn-delete { background: #e53935; color: #fff; }
    .btn-root   { background: #43a047; color: #fff; }

    hr { border: none; border-top: 1px solid #eee; }

    /* ── event log ── */
    .log-box {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
      overflow-y: auto;
      background: #fafafa;
      min-height: 120px;
      max-height: 200px;
    }

    .log-entry { padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
    .log-add    { color: #2e7d32; }
    .log-delete { color: #c62828; }
    .log-click  { color: #1565c0; }

    /* ── canvas wrapper (holds map + zoom controls) ── */
    #map-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    /* ── canvas area ── */
    #map-container {
      flex: 1;
      overflow: scroll;
      scrollbar-width: none; /* Firefox */
      padding: 20px;
      background: #e8eaf6;
    }
    #map-container::-webkit-scrollbar { display: none; } /* Chrome / Safari */

    /* wrapper keeps canvas left-aligned inside overflow scroll */
    #map-inner {
      position: relative;
      display: inline-block;
      min-width: 100%;
      min-height: 100%;
    }

    /* ── node selection highlight ── */
    .mindmap-node-selected {
      outline: 3px solid #ff9800 !important;
      outline-offset: 2px;
    }

    /* ── zoom controls ── */
    .zoom-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    .zoom-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid #bbb;
      border-radius: 24px;
      padding: 4px 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: #1a237e;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      transition: background .15s;
      flex-shrink: 0;
    }
    .zoom-btn:hover { background: #283593; opacity: 1; }

    #zoom-level {
      min-width: 44px;
      text-align: center;
      font-size: 13px;
      color: #333;
      font-weight: 600;
      user-select: none;
    }

    .zoom-center-btn {
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid #bbb;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a237e;
      padding: 0;
      transition: background .15s;
    }
    .zoom-center-btn:hover { background: #e8eaf6; opacity: 1; }
  </style>
</head>
<body>

<header>📁 目录组织结构 – MindMap</header>

<div class="main">

  <!-- ── control panel ── -->
  <div class="panel">

    <h3>添加节点</h3>

    <div class="form-group">
      <label>节点文字</label>
      <input id="inp-text" type="text" value="新节点" placeholder="节点文字" />
    </div>

    <div class="form-group">
      <label>父节点 ID（留空 = 根节点）</label>
      <select id="sel-parent">
        <option value="">-- 无（创建根节点）--</option>
      </select>
    </div>

    <!-- style customisation -->
    <div class="form-group">
      <label>背景色</label>
      <div class="color-row">
        <input id="inp-bg" type="color" value="#e3f2fd" />
        <span id="lbl-bg">#e3f2fd</span>
      </div>
    </div>

    <div class="form-group">
      <label>文字颜色</label>
      <div class="color-row">
        <input id="inp-fg" type="color" value="#0d47a1" />
        <span id="lbl-fg">#0d47a1</span>
      </div>
    </div>

    <div class="form-group">
      <label>圆角 (px)</label>
      <input id="inp-radius" type="number" value="6" min="0" max="50" />
    </div>

    <div class="form-group">
      <label>字体大小 (px)</label>
      <input id="inp-fs" type="number" value="14" min="8" max="32" />
    </div>

    <div class="form-group">
      <label>标签（逗号分隔）</label>
      <input id="inp-tags" type="text" placeholder="tag1, tag2, ..." />
    </div>

    <div class="form-group">
      <label>状态图标</label>
      <select id="sel-state">
        <option value="">— 无 —</option>
        <option value="success">✓ 成功</option>
        <option value="warn">! 警告</option>
      </select>
    </div>

    <button class="btn-add" id="btn-add">＋ 添加节点</button>

    <hr />

    <h3>删除节点</h3>

    <div class="form-group">
      <label>选择要删除的节点</label>
      <select id="sel-delete">
        <option value="">-- 选择节点 --</option>
      </select>
    </div>

    <button class="btn-delete" id="btn-delete">✕ 删除节点</button>

    <hr />

    <h3>事件日志</h3>
    <div class="log-box" id="log-box"></div>

  </div>

  <!-- ── mind-map canvas ── -->
  <div id="map-area">
    <div id="map-container">
      <div id="map-inner"></div>
    </div>

    <!-- ── zoom controls ── -->
    <div class="zoom-controls">
      <div class="zoom-bar">
        <button class="zoom-btn" id="btn-zoom-out" title="缩小" aria-label="缩小">－</button>
        <span id="zoom-level">100%</span>
        <button class="zoom-btn" id="btn-zoom-in" title="放大" aria-label="放大">＋</button>
      </div>
      <button class="zoom-center-btn" id="btn-center" title="内容居中" aria-label="内容居中">⊙</button>
    </div>
  </div>

</div>

<script src="mindmap.js"></script>
<script>
  // ── Instantiate ─────────────────────────────────────────────────────────────
  const mm = new MindMap('#map-inner', {
    layout: 'directory',
    nodeWidth: 220,
    nodeHeight: 32,
    indentWidth: 28,
    vSpacing: 6,
    lineColor: '#90a4ae',
    lineWidth: 1.5,
    defaultStyle: {
      backgroundColor: '#e3f2fd',
      color: '#0d47a1',
      borderRadius: '3px',
      fontSize: '13px',
      fontFamily: 'Consolas, "Courier New", monospace',
      border: '1px solid #90caf9',
      padding: '4px 15px',
      boxSizing: 'border-box',
      textAlign: 'left',
      cursor: 'pointer',
      userSelect: 'none',
      whiteSpace: 'normal',
      wordBreak: 'break-word',
    },
  });

  // ── Event handlers ──────────────────────────────────────────────────────────
  mm.on('nodeAdded', ({ node }) => {
    log(`nodeAdded  id="${node.id}"  text="${node.text}"  parentId="${node.parentId}"`, 'add');
    refreshSelects();
  });

  mm.on('nodeDeleted', ({ nodeIds, nodes }) => {
    const labels = nodes.map((n) => `"${n.text}"(${n.id})`).join(', ');
    log(`nodeDeleted  ids=[${nodeIds.join(', ')}]  nodes=[${labels}]`, 'delete');
    refreshSelects();
    // Clear selection highlight if selected node was deleted
    if (nodeIds.includes(selectedId)) selectedId = null;
  });

  mm.on('nodeClicked', ({ node }) => {
    log(`nodeClicked  id="${node.id}"  text="${node.text}"`, 'click');
  });

  // ── Node selection ──────────────────────────────────────────────────────────
  let selectedId = null;

  document.getElementById('map-inner').addEventListener('click', (e) => {
    const el = e.target.closest('[data-node-id]');
    if (!el) return;
    const id = el.getAttribute('data-node-id');

    // Deselect previous
    document.querySelectorAll('[data-node-id]').forEach((n) =>
      n.classList.remove('mindmap-node-selected'),
    );

    if (id === selectedId) {
      selectedId = null;
    } else {
      selectedId = id;
      el.classList.add('mindmap-node-selected');
      // Auto-fill the parent selector
      document.getElementById('sel-parent').value = id;
      document.getElementById('sel-delete').value = id;
    }
  });

  // ── UI helpers ──────────────────────────────────────────────────────────────

  function refreshSelects() {
    const parentSel = document.getElementById('sel-parent');
    const deleteSel = document.getElementById('sel-delete');
    const prevParent = parentSel.value;
    const prevDelete = deleteSel.value;

    parentSel.innerHTML = '<option value="">-- 无（创建根节点）--</option>';
    deleteSel.innerHTML = '<option value="">-- 选择节点 --</option>';

    // Walk all root trees in BFS order for display
    mm.getRootIds().forEach((rootId) => {
      const queue = [{ id: rootId, depth: 0 }];
      while (queue.length) {
        const { id, depth } = queue.shift();
        const node = mm.getNode(id);
        if (!node) continue;
        const indent = '　'.repeat(depth);
        const label = `${indent}${node.text} (${id})`;

        const opt1 = new Option(label, id);
        const opt2 = new Option(label, id);
        parentSel.appendChild(opt1);
        deleteSel.appendChild(opt2);

        node.children.forEach((cid) => queue.push({ id: cid, depth: depth + 1 }));
      }
    });

    // Restore previous selections if still valid
    if ([...parentSel.options].some((o) => o.value === prevParent))
      parentSel.value = prevParent;
    if ([...deleteSel.options].some((o) => o.value === prevDelete))
      deleteSel.value = prevDelete;
  }

  function log(msg, type) {
    const box = document.getElementById('log-box');
    const entry = document.createElement('div');
    entry.className = `log-entry log-${type}`;
    const now = new Date().toLocaleTimeString();
    entry.textContent = `[${now}] ${msg}`;
    box.prepend(entry);
  }

  // Sync color label displays
  ['bg', 'fg'].forEach((key) => {
    const inp = document.getElementById(`inp-${key}`);
    const lbl = document.getElementById(`lbl-${key}`);
    inp.addEventListener('input', () => { lbl.textContent = inp.value; });
  });

  // ── Button: Add node ────────────────────────────────────────────────────────
  document.getElementById('btn-add').addEventListener('click', () => {
    const text    = document.getElementById('inp-text').value.trim() || '新节点';
    const parentId = document.getElementById('sel-parent').value || null;
    const bg      = document.getElementById('inp-bg').value;
    const fg      = document.getElementById('inp-fg').value;
    const radius  = document.getElementById('inp-radius').value + 'px';
    const fs      = document.getElementById('inp-fs').value + 'px';
    const tagsRaw = document.getElementById('inp-tags').value;
    const tags    = tagsRaw.split(',').map((t) => t.trim()).filter((t) => t.length > 0);
    const state   = document.getElementById('sel-state').value;

    const style = {
      backgroundColor: bg,
      color: fg,
      borderRadius: radius,
      fontSize: fs,
      border: `2px solid ${darken(bg)}`,
    };

    try {
      const newId = mm.addNode(parentId, { text, tags, state }, style);
      // Auto-select new node
      document.getElementById('sel-parent').value = newId;
      document.getElementById('sel-delete').value = newId;
    } catch (err) {
      alert(err.message);
    }
  });

  // ── Button: Delete node ─────────────────────────────────────────────────────
  document.getElementById('btn-delete').addEventListener('click', () => {
    const id = document.getElementById('sel-delete').value;
    if (!id) { alert('请先选择要删除的节点。'); return; }
    try {
      mm.deleteNode(id);
    } catch (err) {
      alert(err.message);
    }
  });

  // ── Helpers ─────────────────────────────────────────────────────────────────

  /** Darken a hex colour by ~20 % for the border. */
  function darken(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, (n >> 16) - 40);
    const g = Math.max(0, ((n >> 8) & 0xff) - 40);
    const b = Math.max(0, (n & 0xff) - 40);
    return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
  }

  // ── Seed an initial directory tree ──────────────────────────────────────────
  const rootStyle = {
    backgroundColor: '#1565c0',
    color: '#fff',
    border: '1px solid #0d47a1',
    fontSize: '14px',
    fontWeight: 'bold',
    borderRadius: '4px',
  };
  const folderStyle = {
    backgroundColor: '#fff8e1',
    color: '#5d4037',
    border: '1px solid #ffe082',
    borderRadius: '3px',
  };
  const fileStyle = {
    backgroundColor: '#f1f8e9',
    color: '#33691e',
    border: '1px solid #c5e1a5',
    borderRadius: '3px',
    fontSize: '12px',
  };

  const rootId = mm.addNode(null, { id: 'root', text: '组织结构图', layoutType: '组织结构', tags: ['v2.0', 'main'], state: 'success' }, rootStyle);

  const srcId  = mm.addNode(rootId, { text: '目录组织图', layoutType: '目录组织结构', tags: ['src'], state: 'success' },   folderStyle);
  mm.addNode(srcId,  { text: '目录组织图', layoutType: '目录组织结构', tags: ['js', 'ts'], state: 'success' },   fileStyle);
  mm.addNode(srcId,  { text: '目录组织图', layoutType: '目录组织结构', state: 'warn' },     fileStyle);
  const compId = mm.addNode(srcId, { text: '目录组织图', layoutType: '目录组织结构', tags: ['components'] }, folderStyle);
  mm.addNode(compId, { text: '目录组织图', layoutType: '目录组织结构', state: 'success' }, fileStyle);
  mm.addNode(compId, { text: '目录组织图', layoutType: '目录组织结构' }, fileStyle);

  const docsId = mm.addNode(rootId, { text: '目录组织图', layoutType: '目录组织结构', tags: ['docs'], state: 'warn' },  folderStyle);
  mm.addNode(docsId, { text: '目录组织图', layoutType: '目录组织结构' }, fileStyle);
  mm.addNode(docsId, { text: '目录组织图', layoutType: '目录组织结构' },    fileStyle);

  const testId = mm.addNode(rootId, { text: '目录组织图', layoutType: '目录组织结构', tags: ['test', 'ci'], state: 'success' }, folderStyle);
  mm.addNode(testId, { text: '目录组织图', layoutType: '目录组织结构', state: 'success' },  fileStyle);
  mm.addNode(testId, { text: '目录组织图', layoutType: '目录组织结构', state: 'warn' },   fileStyle);

  mm.addNode(rootId, { text: '目录组织图', layoutType: '目录组织结构' },  fileStyle);
  mm.addNode(rootId, { text: '目录组织图', layoutType: '目录组织结构' },     fileStyle);

  refreshSelects();

  // ── Zoom & center ────────────────────────────────────────────────────────────
  const ZOOM_STEP = 0.15;
  const ZOOM_MIN  = 0.25;
  const ZOOM_MAX  = 3.0;
  let currentZoom = 1.0;

  function applyZoom(z) {
    const container = document.getElementById('map-container');
    // Convert current viewport centre to content coordinates (pre-zoom)
    const contentCenterX = (container.scrollLeft + container.clientWidth  / 2) / currentZoom;
    const contentCenterY = (container.scrollTop  + container.clientHeight / 2) / currentZoom;

    currentZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
    document.getElementById('map-inner').style.zoom = currentZoom;
    document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';

    // Restore the same content point at the viewport centre after zoom
    requestAnimationFrame(() => {
      container.scrollLeft = contentCenterX * currentZoom - container.clientWidth  / 2;
      container.scrollTop  = contentCenterY * currentZoom - container.clientHeight / 2;
    });
  }

  function centerContent() {
    const container = document.getElementById('map-container');
    const inner     = document.getElementById('map-inner');
    // offsetWidth/Height already reflect the CSS zoom scaling
    container.scrollLeft = Math.max(0, (inner.offsetWidth  - container.clientWidth)  / 2);
    container.scrollTop  = Math.max(0, (inner.offsetHeight - container.clientHeight) / 2);
  }

  document.getElementById('btn-zoom-in') .addEventListener('click', () => applyZoom(currentZoom + ZOOM_STEP));
  document.getElementById('btn-zoom-out').addEventListener('click', () => applyZoom(currentZoom - ZOOM_STEP));
  document.getElementById('btn-center')  .addEventListener('click', centerContent);

  // Keyboard shortcuts: Ctrl/⌘ + Plus/Minus to zoom, Ctrl/⌘ + 0 to center
  document.addEventListener('keydown', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); applyZoom(currentZoom + ZOOM_STEP); }
    if (e.key === '-')                  { e.preventDefault(); applyZoom(currentZoom - ZOOM_STEP); }
    if (e.key === '0')                  { e.preventDefault(); centerContent(); }
  });

  // Auto-center content on initial load
  requestAnimationFrame(centerContent);
</script>
</body>
</html>
